<!DOCTYPE html>
<html lang="ko" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2C1C10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=yes">
<title>김도윤 (Kevin Kim) — 게임 클라이언트 프로그래머 / 테크니컬 PM 포트폴리오</title>
<meta name="description" content="언리얼·유니티 기반 게임 개발자 김도윤(Kevin Kim)의 포트폴리오. 팀 프로젝트 8건, 개인 프로젝트 19건, 청강대 X 유니티 게임잼 우수상.">
<link rel="icon" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/favicon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="김도윤 (Kevin Kim) — 게임 클라이언트 프로그래머 / 테크니컬 PM">
<meta property="og:description" content="팀 프로젝트 8건, 개인 프로젝트 19건, 게임잼 우수상. 언리얼 · 유니티 · 네트워크 · 그래픽스.">
<meta property="og:image" content="preview.png">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/content.css">
<link rel="stylesheet" href="assets/css/intro.css">
<link rel="stylesheet" href="assets/css/book.css">
</head>
<body>

<!-- entry screen: the game index, built from the data in assets/js/data -->
<div class="intro" id="intro"></div>

<div class="app">
  <div class="wood"><img class="woodimg" src="assets/img/desk-wood.jpg" alt=""></div>

  <header class="bar">
    <div class="bar__id">KIM DOYOON <b>/</b> KEVIN KIM</div>
    <nav class="bar__nav" id="nav"></nav>
    <div class="bar__tools">
      <button class="iconbtn" id="homeBtn" type="button">⌂ 첫 화면</button>
      <button class="iconbtn" id="modeBtn" type="button">☰ 전체보기</button>
      <a class="iconbtn" href="document.html">▤ 문서로 보기</a>
      <button class="iconbtn" id="themeBtn" type="button" aria-label="조명 전환">☾</button>
      <button class="iconbtn" id="printBtn" type="button">PDF 저장</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="book" id="book">
      <div class="half half--l"><div class="paper" id="slot0"></div></div>
      <div class="half half--r"><div class="paper" id="slot1"></div></div>
      <div class="spine"></div>
      <div class="leaf" id="leaf">
        <div class="face face--front"><div class="paper" id="leafFront"></div><div class="shade shade--f" id="shF"></div></div>
        <div class="face face--back"><div class="paper" id="leafBack"></div><div class="shade shade--b" id="shB"></div></div>
      </div>
      <div class="hint" id="hint">드래그 · 좌우 배경 클릭으로 넘기기</div>
    </div>
  </div>

  <div class="pager">
    <button class="pgbtn" id="prevBtn" type="button">◀ 이전</button>
    <div class="ticks" id="ticks"></div>
    <div class="counter" id="counter"></div>
    <button class="pgbtn" id="nextBtn" type="button">다음 ▶</button>
  </div>
</div>

<div class="modal" id="pdfModal" hidden>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="pdfTitle">
    <div class="modal__head"><b id="pdfTitle">PDF로 저장 · 인쇄</b><button class="modal__x" id="pdfClose" type="button" aria-label="닫기">✕</button></div>
    <div class="modal__body">
      <p class="modal__p">저장할 범위를 선택하세요. 인쇄 창이 열리면 <b>대상</b>을 <b>PDF로 저장</b>으로 바꾸면 파일로 받을 수 있습니다.</p>
      <div class="opts">
        <label class="opt"><input type="radio" name="pdfscope" value="all" checked><span>전체</span><em id="pdfAllN"></em></label>
        <label class="opt"><input type="radio" name="pdfscope" value="cur"><span>지금 펼쳐진 면만</span><em id="pdfCurN"></em></label>
        <label class="opt"><input type="radio" name="pdfscope" value="pick"><span>원하는 쪽 직접 선택</span><em>체크</em></label>
      </div>
      <div class="picker" id="pdfPicker" hidden>
        <div class="picker__tools">
          <button type="button" data-all="1">전체 선택</button>
          <button type="button" data-all="0">전체 해제</button>
        </div>
        <div class="picker__grid" id="pdfGrid"></div>
      </div>
    </div>
    <div class="modal__foot">
      <span class="modal__cnt" id="pdfCount"></span>
      <button class="pgbtn" id="pdfCancel" type="button">취소</button>
      <button class="pgbtn pgbtn--go" id="pdfGo" type="button">인쇄 / PDF 저장</button>
    </div>
  </div>
</div>

<!-- sheets are built into here from the data files below -->
<div id="store" hidden></div>

<!-- content: the same four files every layout loads -->
<script src="assets/js/data/profile.js"></script>
<script src="assets/js/data/pages.js"></script>
<script src="assets/js/data/qa.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/interactions.js"></script>
<script src="assets/js/ask.js"></script>
<script src="assets/js/intro.js"></script>
<!-- layout -->
<script src="assets/js/book.js"></script>
</body>
</html>
